# Dataset configuration used by data_preprocess.py. Fields omitted from a
# dataset entry use the defaults defined by DatasetConfig.
preprocessing:
  seed: 85

# Disable display_answers and use a prompt template instead:
# tool_selection: []
# prompt_template: |-
#   Solve the following problem. End with "Answer: $ANSWER".
#
#   {question}

# Enable thinking for all rows, or for a random fraction of rows (if not specified, thinking is disabled):
# enable_thinking: 1.0  # all rows
# enable_thinking: 0.5  # approximately half of the rows

train_datasets:

  # - name: big_math_rl_verified
  #   dataset_id: SynthLabsAI/Big-Math-RL-Verified
  #   split: train
  #   adapter: math
  #   data_source: SynthLabsAI/Big-Math-RL-Verified
  #   subject_key: domain
  #   tool_selection: [display_answers]

  # random dataset above is gated
  - name: numina_math_rl_verified
    dataset_id: nlile/NuminaMath-1.5-RL-Verifiable
    split: train
    adapter: math
    data_source: nlile/NuminaMath-1.5-RL-Verifiable
    subject_key: domain
    tool_selection: [display_answers]

  - name: deepmath103k
    dataset_id: zwhe99/DeepMath-103K
    split: train
    adapter: math
    data_source: zwhe99/DeepMath-103K
    question_key: question
    answer_key: final_answer
    solution_key: r1_solution_1
    subject_key: topic
    tool_selection: [display_answers]

  - name: if_rl_singleturn
    dataset_id: swiss-ai/if-rl-singleturn-prompts
    split: train
    adapter: if_data
    data_source: swiss-ai/if-rl-singleturn-prompts
    prompt_key: messages
    answer_key: ground_truth
    subject_key: constraint_type

  - name: if_rl_singleturn_hard
    dataset_id: swiss-ai/if-rl-singleturn-hard-prompts
    split: train
    adapter: if_data
    data_source: swiss-ai/if-rl-singleturn-hard-prompts
    prompt_key: messages
    answer_key: ground_truth
    subject_key: constraint_type

  - name: taco_verified
    dataset_id: likaixin/TACO-verified
    split: train
    adapter: taco
    data_source: taco
    question_key: question
    answer_key: input_output
    solution_key: solutions
    subject_key: source

  - name: apps
    dataset_id: ReactiveAI/codeparrot-apps-reupload
    split: train
    adapter: apps
    data_source: apps
    question_key: question
    answer_key: input_output
    solution_key: solutions

  - name: rgym
    dataset_id: /capstor/store/cscs/swissai/infra01/reasoning/data/RL-prod/rgym/train.parquet
    split: train
    adapter: rgym
    data_source: rgym
    sample_size: 50000
    tool_selection: [display_answers]

  - name: riddle_sense
    dataset_id: /capstor/store/cscs/swissai/infra01/reasoning/data/RL-prod/riddle_sense/train.parquet
    split: train
    adapter: riddle_sense
    data_source: riddle_sense
    question_key: question
    answer_key: answerKey
    tool_selection: [display_answers]

  - name: lexam_mcq
    dataset_id: LEXam-Benchmark/LEXam
    subset: mcq_4_choices
    split: test
    adapter: lexam_mcq
    data_source: lexam_mcq
    question_key: question
    answer_key: gold
    subject_key: area
    tool_selection: [display_answers]

  - name: table_gpt
    dataset_id: LipengCS/Table-GPT
    split: mixed
    adapter: table_gpt
    data_source: table_gpt
    answer_key: completion

  # - name: vrl
  #   dataset_id: /capstor/store/cscs/swissai/infra01/reasoning/data/RL-prod/vrl/train.parquet
  #   split: train
  #   adapter: vrl
  #   data_source: blindtasks_rl
  #   tool_selection: [display_answers]

  - name: code_contests
    dataset_id: deepmind/code_contests
    split: train
    adapter: code_contests
    data_source: codecontests
    question_key: description
    solution_key: solutions

  - name: open_r1_codeforces
    dataset_id: open-r1/codeforces
    subset: verifiable
    split: train
    adapter: open_r1_codeforces
    data_source: codeforces

  - name: toolgym
    dataset_id: /capstor/store/cscs/swissai/infra01/reasoning/data/RL-prod/toolgym_test_v3/dataset/train.parquet
    split: train
    adapter: tools
    data_source: tool_gym

eval_datasets:

  - name: rgym
    dataset_id: /capstor/store/cscs/swissai/infra01/reasoning/data/RL-prod/rgym/val_mini.parquet
    split: val_mini
    adapter: rgym
    data_source: rgym
    sample_size: 200

  - name: gsm8k
    dataset_id: openai/gsm8k
    subset: main
    split: test
    adapter: gsm8k
    data_source: openai/gsm8k
    question_key: question
    sample_size: 100
    tool_selection: [display_answers]

  - name: math500
    dataset_id: HuggingFaceH4/MATH-500
    split: test
    adapter: math
    data_source: HuggingFaceH4/MATH-500
    subject_key: subject
    solution_key: solution
    sample_size: 50
    tool_selection: [display_answers]

  - name: aime2024
    dataset_id: HuggingFaceH4/aime_2024
    split: train
    adapter: math
    data_source: aime2024
    solution_key: solution
    tool_selection: [display_answers]

  - name: aime2025
    dataset_id: math-ai/aime25
    split: test
    adapter: math
    data_source: aime2025
    tool_selection: [display_answers]

  # - name: gpqa_diamond
  #   dataset_id: Idavidrein/gpqa
  #   subset: gpqa_diamond
  #   split: train
  #   adapter: gpqa
  #   data_source: gpqa_diamond
  #   question_key: Question
  #   answer_key: Correct Answer
  #   shuffle_choices: true
  #   sample_size: 100
  #   tool_selection: [display_answers]

  - name: mmlu
    dataset_id: cais/mmlu
    subset: all
    split: test
    adapter: multiple_choice
    data_source: mmlu
    question_key: question
    subject_key: subject
    sample_size: 100
    tool_selection: [display_answers]

  - name: openai_humaneval
    dataset_id: openai/openai_humaneval
    subset: openai_humaneval
    split: test
    adapter: humaneval
    data_source: humaneval
    question_key: prompt
    answer_key: test
    solution_key: canonical_solution
    prompt_key: entry_point
    sample_size: 100

  - name: ifeval
    dataset_id: google/IFEval
    split: train
    adapter: if_eval
    data_source: google/IFEval
    sample_size: 100

  - name: ifbench
    dataset_id: allenai/IFBench_test
    split: train
    adapter: if_eval
    data_source: allenai/IFBench_test
    sample_size: 100

  - name: toolgym
    dataset_id: /capstor/store/cscs/swissai/infra01/reasoning/data/RL-prod/toolgym_test_v3/dataset/val.parquet
    split: train
    adapter: tools
    data_source: tool_gym
