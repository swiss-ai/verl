image = "/capstor/scratch/cscs/atazza/apertus_sglang_megatron/sanity_fix.sqsh"

mounts = [
  "/capstor",
  "/iopsstor",
  "/users",
  "/tmp",
  "/usr/lib64/libjson-c.so.5:/usr/lib64/libjson-c.so.5",
  "/usr/lib64/libjson-c.so.5.2.0:/usr/lib64/libjson-c.so.5.2.0",
  "/usr/lib64/libjson-c.so.5:/usr/lib/libjson-c.so.5",
  "/usr/lib64/libjson-c.so.5.2.0:/usr/lib/libjson-c.so.5.2.0"
]
[annotations]
com.hooks.cxi.enabled = "true"
com.hooks.aws_ofi_nccl.enabled = "true"
com.hooks.aws_ofi_nccl.variant = "cuda-dl"

[env]
ROCR_VISIBLE_DEVICES=""
NCCL_NET_PLUGIN = "ofi"
NCCL_NET = "AWS Libfabric"
NCCL_CROSS_NIC = "1"
NCCL_NET_GDR_LEVEL = "PHB"
NCCL_SOCKET_IFNAME = "hsn"
NCCL_PROTO = "^LL128"
FI_CXI_COMPAT = "0"
FI_MR_CACHE_MONITOR = "userfaultfd"
FI_CXI_RX_MATCH_MODE = "software"
FI_CXI_DEFAULT_CQ_SIZE = "131072"
FI_CXI_DEFAULT_TX_SIZE = "32768"
FI_CXI_DISABLE_HOST_REGISTER = "1"
OFI_NCCL_DISABLE_DMABUF = "1"
HF_HOME = "/capstor/store/cscs/swissai/infra01/reasoning/raas/.cache/huggingface"
# FLASHINFER_WORKSPACE_DIR = "/capstor/store/cscs/swissai/infra01/reasoning/raas/.cache/flashinfer"
TVM_FFI_CACHE_DIR = "/capstor/store/cscs/swissai/infra01/reasoning/raas/.cache/tvm-ffi"
