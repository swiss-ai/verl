defaults:
  - 1p5
  - _self_

algorithm:
  adv_estimator: rloo_vectorized

actor_rollout_ref:
  actor:
    ppo_max_token_len_per_gpu: 49152
    clip_ratio_high: 0.4
    clip_ratio_low: 0.4
    policy_loss:
      loss_mode: geo_mean
    # loss_agg_mode is unused by geo_mean but set for consistency
    loss_agg_mode: seq-mean-token-mean

  rollout:
    log_prob_max_token_len_per_gpu: 49152
    max_num_batched_tokens: 32768
    max_num_seqs: 512

trainer:
  experiment_name: gmpo-loo-group-filtering
  nnodes: 16
