defaults:
  - 1p5
  - _self_

algorithm:
  adv_estimator: grpo

actor_rollout_ref:
  actor:
    ppo_max_token_len_per_gpu: 49152
    clip_ratio_high: 0.28
    clip_ratio_low: 0.2
    loss_agg_mode: token-mean

  rollout:
    log_prob_max_token_len_per_gpu: 49152
    max_num_batched_tokens: 32768
    max_num_seqs: 512

trainer:
  experiment_name: grpo-group-filtering
  nnodes: 16
