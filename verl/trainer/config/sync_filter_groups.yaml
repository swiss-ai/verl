defaults:
  - ppo_trainer
  - _self_

algorithm:
  adv_estimator: rloo_vectorized
  norm_adv_by_std_in_grpo: false
  filter_groups:
    enable: true
    metric: acc
    min: 0.0
    max: 1.0
    max_num_gen_batches: 10

data:
  train_files: ./data/apertus_demo_rl/train.parquet
  val_files: ./data/apertus_demo_rl/val.parquet
  train_batch_size: 256
  max_prompt_length: 2048
  max_response_length: 6144
  truncation: left
  apply_chat_template_kwargs:
    enable_thinking: false

actor_rollout_ref:
  nccl_timeout: 1800
  model:
    path: swiss-ai/Apertus-8B-Instruct-2509
    tokenizer_path: null
    use_remove_padding: true
    enable_gradient_checkpointing: true
    use_shm: false
    override_config:
      attn_implementation: flash_attention_3
  actor:
    use_rollout_log_probs: true
    ppo_mini_batch_size: 128
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 8192
    optim:
      optimizer: _AdamW
      lr: 1e-6
      weight_decay: 0.01
      clip_grad: 1.0
      optimizer_impl: torchao.optim
      override_optimizer_config:
        bf16_stochastic_round: true
    strategy: fsdp2
    fsdp_config:
      fsdp_size: 32
      strategy: fsdp2
      param_offload: false
      optimizer_offload: false
      entropy_from_logits_with_chunking: ${oc.select:actor_rollout_ref.actor.entropy_from_logits_with_chunking,false}
      entropy_checkpointing: ${oc.select:actor_rollout_ref.actor.entropy_checkpointing,false}
      model_dtype: bf16
      mixed_precision:
        param_dtype: bf16
        reduce_dtype: bf16
        buffer_dtype: bf16
    clip_ratio_high: 0.28
    clip_ratio_low: 0.2
    use_kl_loss: false
    policy_loss:
      loss_mode: geo_mean
    loss_agg_mode: seq-mean-token-mean
    shuffle: true
  rollout:
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 8192
    max_num_batched_tokens: 8192
    max_num_seqs: 64
    gpu_memory_utilization: 0.7
    tensor_model_parallel_size: 1
    n: 8
    name: sglang
    dtype: bfloat16
    multi_stage_wake_up: true
    free_cache_engine: true
    enforce_eager: false
    load_format: safetensors
    val_kwargs:
      do_sample: true
      n: 4
      top_p: 0.95
      temperature: 0.7

critic:
  strategy: fsdp2
  checkpoint:
    save_contents: []

trainer:
  total_epochs: 100
  total_training_steps: 1000
  save_freq: 20
  test_freq: 10
  max_actor_ckpt_to_keep: 10
  max_critic_ckpt_to_keep: null
  project_name: rl-sync-group-filtering
  experiment_name: rl-sync-group-filtering
  logger: ["console", "wandb"]
  nnodes: 2
  n_gpus_per_node: 4
  log_val_generations: 5
  val_before_train: true
  default_local_dir: ./outputs/${trainer.project_name}/${trainer.experiment_name}
  rollout_data_dir: ${trainer.default_local_dir}/rollout/
  validation_data_dir: ${trainer.default_local_dir}/validation/

ray_kwargs:
  ray_init:
    num_cpus: ${oc.decode:${oc.env:SLURM_CPUS_PER_TASK,null}}
  timeline_json_file: null
